<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تم التحقق</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.jpg') }}">

  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #1a3d32 0%, #2d4a3e 100%);
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #f5f1eb;
      width: 100%;
      max-width: 450px;
      padding: 40px 30px;
      border-radius: 20px;
      border: 3px solid #c9a66b;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      color: #2d4a3e;
      font-size: 1.9rem;
      margin-bottom: 15px;
    }

    p {
      color: #444;
      font-size: 1rem;
      margin-bottom: 25px;
      line-height: 1.7;
    }

    a.button {
      display: inline-block;
      width: 100%;
      background: #2d4a3e;
      color: white;
      padding: 12px 0;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 1.1rem;
      position: relative;
      overflow: hidden;
      transition: all .3s ease;
    }

    a.button::after {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(201,166,107,0.4);
      transition: left .3s ease;
    }

    a.button:hover {
      background: #c9a66b;
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(201,166,107,0.4);
    }

    a.button:hover::after {
      left: 0;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>تم التحقق من بريدك الإلكتروني</h1>
    <p>شكرًا لك! تم تفعيل حسابك بنجاح، ويمكنك الآن تسجيل الدخول.</p>
    <a href="/login" class="button">العودة لتسجيل الدخول</a>
  </div>
</body>
</html>
