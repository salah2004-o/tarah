<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف التعريفي - الثراء</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.jpg') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        li {
            list-style-type: none;
            margin: 10px 0;
            font-size: 18px;
            font-weight: bold;

            contain: content;

        a {
            text-decoration: none;
            color: #15491e;
        }
        a:hover {

            <img src="{{ url_for('static', filename='images/profile.svg') }}" alt="الملف التعريفي">
            <p>هنا يمكنك قراءة أو تحميل الملف التعريفي الكامل للشركة.</p>
        </div>
    </section>

</html>
