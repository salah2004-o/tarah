<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فشل التحقق</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.jpg') }}">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a3d32 0%, #2d4a3e 100%);
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #f5f1eb;
            width: 100%;
            max-width: 450px;
            padding: 35px 30px;
            border-radius: 20px;
            text-align: center;
            border: 3px solid #c9a66b;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.6s ease;
            margin-bottom: 25px;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #2d4a3e;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        p {
            color: #444;
            font-size: 1rem;
            line-height: 1.7;
        }

        .support {
            background: #f5f1eb;
            border: 3px solid #c9a66b;
            padding: 20px 25px;
            border-radius: 15px;
            text-align: center;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            animation: fadeInUp 0.7s ease;
        }

        .support h2 {
            color: #2d4a3e;
            margin-bottom: 15px;
        }

        .support button {
            width: 100%;
            background: #2d4a3e;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .support button::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            height: 100%;
            width: 100%;
            background: rgba(201, 166, 107, 0.4);
            transition: left 0.3s ease;
        }

        .support button:hover::after {
            left: 0;
        }

        .support button:hover {
            background: #c9a66b;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(201,166,107,0.4);
        }

        .support a {
            text-decoration: none;
            color: white;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>فشل التحقق</h1>
        <p>نأسف! حدث خطأ أثناء محاولة التحقق من بريدك الإلكتروني.<br>
           يرجى المحاولة مرة أخرى أو التواصل مع الدعم الفني.</p>
    </div>

    <div class="support">
        <h2>الدعم الفني</h2>
        <button>
            <a href="https://t.me/THE_SALAH_1" target="_blank">الاتصال عبر تيليجرام</a>
        </button>
    </div>

</body>
</html>
