<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الثراء - إنشاء حساب جديد</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.jpg') }}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

        :root {
            --dark-green: #052c25;
            --primary-gold: #c9a66b;
            --light-beige: #f5f1eb;
        }

        body {
            background: linear-gradient(135deg, var(--dark-green) 0%, #0a4036 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Cairo', sans-serif;
            padding: 40px 20px;
        }

        .register-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 500px;
            border: 1px solid rgba(201, 166, 107, 0.3);
            animation: fadeInUp 0.7s ease;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-text {
            font-size: 2.8rem;
            font-weight: bold;
            color: var(--dark-green);
            margin: 0;
        }

        .logo-subtitle {
            color: var(--primary-gold);
            font-size: 1rem;
            font-weight: 600;
        }

        .clock {
            font-size: 0.8rem;
            color: #777;
            margin-top: 10px;
            background: var(--light-beige);
            padding: 5px 15px;
            border-radius: 50px;
            display: inline-block;
        }

        h2 {
            color: var(--dark-green);
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.6rem;
            font-weight: 700;
        }

        .form-label {
            color: var(--dark-green);
            font-weight: 700;
            font-size: 0.9rem;
        }

        .input-group-text {
            background-color: transparent;
            border-left: none;
            color: var(--primary-gold);
            border-radius: 0 12px 12px 0 !important;
        }

        .form-control {
            border: 1.5px solid #eee;
            border-right: none;
            border-radius: 12px 0 0 12px !important;
            padding: 12px;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: var(--primary-gold);
            box-shadow: none;
            background-color: #fff9f0;
        }

        .btn-register {
            background-color: var(--dark-green);
            color: var(--primary-gold);
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            transition: 0.4s;
            margin-top: 15px;
        }

        .btn-register:hover {
            background-color: var(--primary-gold);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(201, 166, 107, 0.3);
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #eee;
        }

        .divider span {
            background: white;
            padding: 0 15px;
            position: relative;
            color: #999;
            font-size: 0.85rem;
        }

        .login-link {
            text-align: center;
            font-size: 0.95rem;
            color: #666;
        }

        .login-link a {
            color: var(--dark-green);
            font-weight: bold;
            text-decoration: none;
            border-bottom: 2px solid var(--primary-gold);
        }

        .error-message {
            background-color: #fdeaea;
            color: #a63d3d;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9rem;
            border: 1px solid #a63d3d;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

    <div class="register-container">
        <div class="logo-section">
            <div class="logo-text">الثراء</div>
            <div class="logo-subtitle">انضم لنخبة الطموحين</div>
            <div id="liveClock" class="clock"></div>
        </div>

        <h2>إنشاء حساب جديد</h2>

        <div class="error-message" id="errorMessage"></div>

        <form action="/register" method="POST" onsubmit="return validateForm()">
            <div class="mb-3">
                <label for="username" class="form-label">اسم المستخدم</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user-tag"></i></span>
                    <input type="text" class="form-control" id="username" name="username" placeholder="مثال: Ahmed99" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="name" class="form-label">الاسم الكامل</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-id-card"></i></span>
                    <input type="text" class="form-control" id="name" name="name" placeholder="أدخل اسمك الثلاثي" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">البريد الإلكتروني</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                    <input type="email" class="form-control" id="email" name="email" placeholder="email@example.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">كلمة المرور</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="********" required minlength="6">
                </div>
            </div>

            <div class="mb-4">
                <label for="confirm" class="form-label">تأكيد كلمة المرور</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-check-double"></i></span>
                    <input type="password" class="form-control" id="confirm" name="confirm" placeholder="أعد كتابة كلمة المرور" required>
                </div>
            </div>
            
            <button type="submit" class="btn btn-register w-100">ابدأ رحلتك الآن</button>

            <div class="divider">
                <span>أو سجل عبر</span>
            </div>

            <div class="login-link">
                لديك حساب بالفعل؟ <a href="/login">تسجيل الدخول من هنا</a>
            </div>
        </form>
    </div>

    <script>
        function validateForm() {
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;
            const email = document.getElementById('email').value;
            const errorDiv = document.getElementById('errorMessage');

            // التحقق من تطابق كلمة المرور
            if (password !== confirm) {
                showError('كلمة المرور غير متطابقة!');
                return false;
            }

            // تحقق بسيط من البريد
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                showError('الرجاء إدخال بريد إلكتروني صالح!');
                return false;
            }

            return true;
        }

        function showError(msg) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
            window.scrollTo(0, 0);
            setTimeout(() => { errorDiv.style.display = 'none'; }, 4000);
        }

        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById("liveClock").innerText = "التوقيت المحلي: " + timeStr;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
