<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.jpg') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <title>{% if service %}تعديل الخدمة{% else %}إضافة خدمة جديدة{% endif %} | الثراء</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

    :root {
      --primary-green: #052c25;
      --primary-gold: #c9a66b;
      --primary-beige: #f5f1eb;
      --white: #ffffff;
    }

    body {
      font-family: "Cairo", sans-serif;
      background: linear-gradient(135deg, var(--primary-green) 0%, #0a4036 100%);
      margin: 0;
      padding: 40px 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: 2.2rem;
      margin-bottom: 40px;
      color: var(--primary-gold);
      font-weight: 700;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .service-form {
      background-color: var(--white);
      padding: 40px;
      border-radius: 25px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      color: var(--primary-green);
      border: 1px solid rgba(201, 166, 107, 0.2);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
    }

    .full-width {
      grid-column: span 2;
    }

    label {
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    label i {
      color: var(--primary-gold);
    }

    input, textarea, select {
      width: 100%;
      padding: 12px 15px;
      border-radius: 12px;
      border: 1.5px solid #eee;
      font-family: 'Cairo', sans-serif;
      font-size: 1rem;
      box-sizing: border-box;
      transition: 0.3s;
      background: #fafafa;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary-gold);
      background: white;
      box-shadow: 0 0 10px rgba(201, 166, 107, 0.1);
    }

    textarea {
      height: 120px;
      resize: vertical;
    }

    /* قسم رفع الصور */
    .image-upload-section {
      background: var(--primary-beige);
      padding: 20px;
      border-radius: 15px;
      border: 2px dashed var(--primary-gold);
      text-align: center;
      margin-top: 10px;
    }

    .preview-container {
      margin-top: 15px;
      display: {% if service and service.image_url %}block{% else %}none{% endif %};
    }

    .preview-container img {
      max-width: 200px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      border: 3px solid white;
    }

    .submit-btn {
      background-color: var(--primary-green);
      color: var(--primary-gold);
      padding: 15px 40px;
      border-radius: 12px;
      border: none;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.4s;
      width: 100%;
      margin-top: 20px;
    }

    .submit-btn:hover {
      background-color: var(--primary-gold);
      color: white;
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(201, 166, 107, 0.3);
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: var(--primary-beige);
      text-decoration: none;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .back-link:hover {
      opacity: 1;
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      .full-width { grid-column: span 1; }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>{% if service %}تعديل بيانات الخدمة{% else %}إضافة خدمة إلى "الثراء"{% endif %}</h1>

    <form class="service-form" method="POST" enctype="multipart/form-data">
      <div class="form-grid">
        
        <div class="form-group full-width">
          <label><i class="fas fa-heading"></i> عنوان الخدمة</label>
          <input type="text" name="title" value="{{ service.title if service else '' }}" placeholder="مثال: استشارات مالية متقدمة" required>
        </div>

        <div class="form-group">
          <label><i class="fas fa-tag"></i> السعر (USD)</label>
          <input type="number" step="0.01" name="price" value="{{ service.price if service else '' }}" placeholder="0.00" required>
        </div>

        <div class="form-group">
          <label><i class="fas fa-clock"></i> مدة التسليم (بالأيام)</label>
          <input type="number" name="delivery_time" value="{{ service.delivery_time if service else '' }}" placeholder="مثال: 5">
        </div>

        <div class="form-group full-width">
          <label><i class="fas fa-align-left"></i> تفاصيل الخدمة</label>
          <textarea name="description" placeholder="اشرح للمستخدم مميزات هذه الخدمة...">{{ service.description if service else '' }}</textarea>
        </div>

        <div class="form-group full-width">
          <label><i class="fas fa-image"></i> صورة الخدمة التعريفية</label>
          <div class="image-upload-section">
            <input type="file" name="image" id="imageInput" accept="image/*">
            <div class="preview-container" id="previewContainer">
              <p style="font-size: 0.8rem; color: #666;">معاينة الصورة:</p>
              <img id="imagePreview" src="{% if service and service.image_url %}{{ url_for('static', filename='uploads/' + service.image_url) }}{% endif %}" alt="معاينة">
            </div>
          </div>
        </div>

      </div>

      <button type="submit" class="submit-btn">
        <i class="fas fa-save"></i> {% if service %}حفظ التغييرات{% else %}نشر الخدمة الآن{% endif %}
      </button>
    </form>

    <a href="{{ url_for('admin.admin_services')}}" class="back-link"><i class="fas fa-arrow-right"></i> العودة إلى لوحة التحكم</a>
  </div>

  <script>
    // كود معاينة الصورة قبل الرفع
    const imageInput = document.getElementById('imageInput');
    const imagePreview = document.getElementById('imagePreview');
    const previewContainer = document.getElementById('previewContainer');

    imageInput.onchange = evt => {
      const [file] = imageInput.files;
      if (file) {
        imagePreview.src = URL.createObjectURL(file);
        previewContainer.style.display = 'block';
      }
    }
  </script>
</body>
</html>
